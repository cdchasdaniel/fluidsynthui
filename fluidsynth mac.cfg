# FluidSynth Configuration File
# FluidSynth settings and application-specific settings

# Path to soundfont directory (relative to project root)
soundfont_path = sf
# Maximum MP3 upload size in megabytes
mp3_max_upload_mb = 100

# Audio driver: coreaudio (macOS), alsa (Linux), pulseaudio (Linux), jack, portaudio
# Using coreaudio for macOS development
audio.driver = coreaudio

# MIDI Configuration
# On macOS, use CoreMIDI driver for hardware MIDI controllers
midi.driver = coremidi

synth.gain = 4.0

# Auto-connect to available MIDI input ports
midi.autoconnect = 1

