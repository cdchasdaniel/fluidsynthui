# FluidSynth Configuration File
# Settings are applied when the FluidSynth server starts

# Path to soundfont directory (relative to project root)
soundfont_path = sf

# Audio driver: coreaudio (macOS), alsa (Linux), pulseaudio (Linux), jack, portaudio
# Try portaudio for better macOS compatibility
audio.driver = portaudio

# Low-latency audio settings
# Smaller values = lower latency but more CPU usage
audio.period-size = 64
audio.periods = 2

# Audio output settings
audio.sample-format = 16bits
synth.sample-rate = 48000
synth.gain = 0.6

# MIDI settings
midi.driver = coremidi
midi.autoconnect = 1

