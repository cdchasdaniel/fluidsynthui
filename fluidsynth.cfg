# FluidSynth Configuration File
# Settings are applied when the FluidSynth server starts

# Path to soundfont directory (relative to project root)
soundfont_path = sf

# Audio driver: alsa, pulseaudio, jack, oss, etc.
audio.driver = pulseaudio

# Low-latency audio settings
# Smaller values = lower latency but more CPU usage
audio.period-size = 64
audio.periods = 2
audio.realtime-prio = 70

# MIDI settings
midi.autoconnect = 1
